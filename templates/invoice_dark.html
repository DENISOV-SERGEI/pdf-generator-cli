<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'DejaVu Sans', 'Roboto', sans-serif; background-color: #1a202c; color: #e2e8f0; padding: 40px; }
        .dark-box { max-width: 750px; margin: auto; background: #2d3748; padding: 30px; border-radius: 8px; border: 1px solid #4a5568; }
        h1 { color: #63b3ed; border-bottom: 1px solid #4a5568; padding-bottom: 10px; font-size: 22px; }
        .details { margin: 20px 0; line-height: 1.6; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th { background: #4a5568; color: #fff; padding: 10px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #4a5568; }
    </style>
</head>
<body>
    <div class="dark-box">
        <h1>ЭЛЕКТРОННЫЙ ЧЕК № {{ invoice_id }}</h1>
        <div class="details">
            <div><strong>Система:</strong> Автоматическая генерация документов</div>
            <div><strong>Дата:</strong> {{ date }}</div>
            <div><strong>Покупатель:</strong> {{ customer_name }}</div>
        </div>
        <table>
            <tr>
                <th>Продукт / Услуга</th>
                <th>Количество</th>
                <th>Цена</th>
            </tr>
            <tr>
                <td>{{ product }}</td>
                <td>{{ qty }}</td>
                <td>{{ price }} ₽</td>
            </tr>
        </table>
    </div>
</body>
</html>
