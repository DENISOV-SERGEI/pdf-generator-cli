<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @page { size: A4 landscape; margin: 0; }
        body { 
            font-family: 'DejaVu Sans', 'Roboto', sans-serif; 
            background-color: #ffffff; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .cert-card {
            width: 277mm;
            height: 190mm;
            padding: 12mm;
            background: linear-gradient(135deg, #0b251e 0%, #133a30 100%); /* Глубокий изумрудный */
            box-sizing: border-box;
            margin: auto;
            position: relative;
            color: #ffffff;
            overflow: hidden;
        }
        /* Декоративные золотые геометрические линии */
        .decor-line-1 { position: absolute; top: -50px; left: -50px; width: 200px; height: 200px; border: 2px solid rgba(212, 175, 55, 0.15); transform: rotate(45deg); }
        .decor-line-2 { position: absolute; bottom: -50px; right: -50px; width: 250px; height: 250px; border: 2px solid rgba(212, 175, 55, 0.15); transform: rotate(15deg); }
        
        .inner-border {
            width: 100%;
            height: 100%;
            border: 1px solid #d4af37; /* Тонкая золотая рамка */
            box-sizing: border-box;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .brand-name {
            font-size: 20px;
            letter-spacing: 5px;
            color: #e2e8f0;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 10px;
        }
        .main-title {
            font-size: 46px;
            font-weight: bold;
            color: #d4af37; /* Золотой цвет */
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 35px;
            margin-bottom: 5px;
        }
        .divider {
            width: 80px;
            height: 1px;
            background-color: #d4af37;
            margin: 15px auto;
        }
        .recipient-label {
            font-size: 16px;
            color: #a0aec0;
            font-style: italic;
            margin-top: 25px;
        }
        .recipient-name {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 10px;
            letter-spacing: 1px;
            overflow-wrap: anywhere;
        }
        .service-text {
            font-size: 18px;
            color: #e2e8f0;
            margin-top: 25px;
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        .service-highlight {
            color: #d4af37;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .footer-details {
            position: absolute;
            bottom: 20px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aec0;
            letter-spacing: 1px;
        }
        .code-badge {
            background: rgba(212, 175, 55, 0.1);
            padding: 4px 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="cert-card">
        <div class="decor-line-1"></div>
        <div class="decor-line-2"></div>
        <div class="inner-border">
            <div class="brand-name">PREMIUM LOUNGE & SPA</div>
            
            <div class="main-title">ПОДАРОЧНЫЙ СЕРТИФИКАТ</div>
            <div class="divider"></div>
            
            <div class="recipient-label">Кому предоставлен:</div>
            <div class="recipient-name">{{ customer_name }}</div>
            
            <div class="service-text">
                Настоящий сертификат даёт право на получение эксклюзивной услуги: <br>
                <span class="service-highlight">«{{ product }}»</span>
            </div>
            
            <div class="footer-details">
                <div>ДАТА АКТИВАЦИИ: {{ date }}</div>
                <div class="code-badge">КОД АКТИВАЦИИ: № {{ invoice_id }}</div>
                <div>СРОК ДЕЙСТВИЯ: 6 МЕСЯЦЕВ</div>
            </div>
        </div>
    </div>
</body>
</html>
