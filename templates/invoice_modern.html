<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'DejaVu Sans', 'Roboto', sans-serif; background-color: #f4f7f6; padding: 30px; }
        .invoice-card { background: #fff; max-width: 700px; margin: auto; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #edf2f7; padding-bottom: 20px; }
        .title { color: #4a5568; font-size: 24px; font-weight: bold; }
        .meta-info { margin-top: 20px; font-size: 14px; color: #718096; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; }
        th { background: #edf2f7; color: #4a5568; padding: 12px; text-align: left; font-size: 14px; }
        td { padding: 15px 12px; border-bottom: 1px solid #e2e8f0; color: #2d3748; }
    </style>
</head>
<body>
    <div class="invoice-card">
        <div class="header">
            <div class="title">СПРАВКА ОБ ОПЛАТЕ</div>
            <div style="color: #3182ce; font-weight: bold;">№ {{ invoice_id }}</div>
        </div>
        <div class="meta-info">
            <p><strong>Дата операции:</strong> {{ date }}</p>
            <p><strong>Получатель платежа:</strong> {{ customer_name }}</p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Описание позиции</th>
                    <th>Кол-во</th>
                    <th>Стоимость</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{ product }}</td>
                    <td>{{ qty }} шт.</td>
                    <td>{{ price }} руб.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
