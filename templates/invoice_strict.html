<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'DejaVu Sans', 'Roboto', sans-serif; color: #000; padding: 10px; font-size: 14px; }
        .strict-wrapper { max-width: 800px; margin: auto; }
        .doc-title { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 30px; text-transform: uppercase; }
        .grid-info { margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        table { width: 100%; border: 2px solid #000; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        th { background: #f2f2f2; font-weight: bold; }
        .sign-block { margin-top: 50px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="strict-wrapper">
        <div class="doc-title">Подтверждение расчета № {{ invoice_id }}</div>
        <div class="grid-info">
            <div><strong>Дата составления:</strong> {{ date }}</div>
            <div><strong>Заказчик (Плательщик):</strong> {{ customer_name }}</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Наименование работ (услуг)</th>
                    <th>Кол-во</th>
                    <th>Сумма (руб.)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td style="text-align: left;">{{ product }}</td>
                    <td>{{ qty }}</td>
                    <td>{{ price }}</td>
                </tr>
            </tbody>
        </table>
        <div class="sign-block">
            <div>Отпустил: _______________</div>
            <div>Получил: _______________</div>
        </div>
    </div>
</body>
</html>
