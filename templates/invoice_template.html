<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'DejaVu Sans', 'Roboto', sans-serif; color: #333; padding: 20px; }
        .invoice-box { max-width: 800px; margin: auto; border: 1px solid #eee; padding: 30px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; word-break: break-all; }
        th { background-color: #f8f9fa; }
        .total { text-align: right; font-weight: bold; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="invoice-box">
        <h1>Счет-фактура № {{ invoice_id }}</h1>
        <p><strong>Дата:</strong> {{ date }}</p>
        <p><strong>Клиент:</strong> {{ customer_name }}</p>
        
        <table>
            <tr>
                <th>Наименование товара</th>
                <th>Количество</th>
                <th>Цена за шт.</th>
            </tr>
            <tr>
                <td>{{ product }}</td>
                <td>{{ qty }} шт.</td>
                <td>{{ price }} руб.</td>
            </tr>
        </table>
    </div>
</body>
</html>
